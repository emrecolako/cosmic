name: i18n screenshots

on:
  push:
    branches:
      - agent/i18n-full-content

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start > /tmp/cosmic.log 2>&1 &
          echo $! > /tmp/cosmic.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cosmic.log
          exit 1
      - name: Capture locales
        run: node scripts/capture-i18n-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-screenshots
          path: artifacts/i18n-screenshots/*.png
          if-no-files-found: error
