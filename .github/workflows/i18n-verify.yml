name: i18n verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify calculations, types, and production build
        run: npm run build

      - name: Verify Accept-Language rendering
        run: |
          npm start > /tmp/cosmic-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && break
            sleep 1
          done
          check_locale() {
            HEADER="$1"
            EXPECTED="$2"
            if [ -n "$HEADER" ]; then
              HTML=$(curl -fsS -H "Accept-Language: $HEADER" http://127.0.0.1:3000)
            else
              HTML=$(curl -fsS http://127.0.0.1:3000)
            fi
            echo "$HTML" | grep -Eq "<html[^>]*lang=\\\"$EXPECTED\\\"" || {
              echo "Expected lang=$EXPECTED for Accept-Language: ${HEADER:-<missing>}"
              exit 1
            }
          }
          check_locale "tr-TR,tr;q=0.9,en;q=0.8" tr
          check_locale "de-DE,de;q=0.9" de
          check_locale "pt-BR,pt;q=0.9" pt
          check_locale "es-419,es;q=0.9" es
          check_locale "zz-ZZ" en
          check_locale "" en
